# Security headers for vgmgroup.in.
#
# Install to /etc/nginx/snippets/vgmgroup-security-headers.conf.
#
# These live in their own file because nginx's add_header does not merge across
# levels: a location that defines any add_header of its own silently discards
# every add_header inherited from the server block. The cache-control locations
# in nginx.conf all define one, so each has to re-assert these headers or the
# documents they serve go out bare.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

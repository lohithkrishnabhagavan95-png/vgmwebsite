# VGM Group website — static SPA served by Nginx.
# Install to /etc/nginx/sites-available/vgmgroup and symlink into sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name vgmgroup.in www.vgmgroup.in;

    # Certbot writes ACME challenges here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vgmgroup.in www.vgmgroup.in;

    ssl_certificate     /etc/letsencrypt/live/vgmgroup.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vgmgroup.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/vgmgroup/current;
    index index.html;

    # Security headers. No CSP here because the app pulls fonts from Google;
    # add one deliberately if you later self-host the fonts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets, so they are immutable...
    location ~ ^/assets/.+\-[A-Za-z0-9_-]{8,}\.(js|css)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ...but media in public/assets keeps its plain name and can be replaced,
    # so it gets a shorter TTL and must revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # index.html must never be cached, or clients pin an old asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths render the SPA shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
